name: 検査

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # ふりがなの覆い・分岐の行き先・N5の85字の割り当て・アイコン名まで
      # ここで機械検査する
      - run: npm test
      - run: npm run build
