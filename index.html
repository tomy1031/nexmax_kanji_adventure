<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="48x48" href="%BASE_URL%favicon-48.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1a33" />
    <meta name="description" content="漢字を学んで、武器をふやして、つよくなろう！ ネクマックスの漢字アドベンチャー" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="漢字アドベンチャー" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without holding up the first paint (the splash below shows at once). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@400;500;700;800;900&family=Shippori+Mincho+B1:wght@600;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@400;500;700;800;900&family=Shippori+Mincho+B1:wght@600;800&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <!-- The splash: drawn from this file alone, before any script or stylesheet
         arrives, so a slow phone sees the game starting instead of a blank
         screen. React replaces it when the title mounts. -->
    <style>
      html { background: #0e0b22; }
      #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
        background: radial-gradient(ellipse at 50% 38%, #2c2a6b 0%, #141235 55%, #07061a 100%); }
      #splash img { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 0 0 3px rgba(255, 214, 140, 0.55), 0 0 42px rgba(255, 170, 70, 0.55);
        animation: splash-breathe 1.8s ease-in-out infinite; }
      #splash .bar { width: 148px; height: 6px; border-radius: 3px; background: rgba(255, 233, 194, 0.16); overflow: hidden; }
      #splash .bar i { display: block; width: 40%; height: 100%; border-radius: 3px; background: linear-gradient(90deg, #ffcf6a, #ff9f3a);
        animation: splash-run 1.1s ease-in-out infinite; }
      #splash p { margin: 0; color: #ffe9c2; font: 700 13px/1 system-ui, sans-serif; letter-spacing: 0.2em; }
      @keyframes splash-breathe { 50% { transform: scale(1.04); } }
      @keyframes splash-run { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { #splash img, #splash .bar i { animation: none; } }
    </style>
    <!-- The title screen's city and logo: fetched alongside the script
         instead of after it (the app is launched on the title). -->
    <link rel="preload" as="image" type="image/webp" href="%BASE_URL%img/title/bg.webp" media="(orientation: portrait)" fetchpriority="high" />
    <link rel="preload" as="image" type="image/webp" href="%BASE_URL%img/title/bg_wide.webp" media="(orientation: landscape)" fetchpriority="high" />
    <link rel="preload" as="image" type="image/webp" href="%BASE_URL%img/title/logo.webp" fetchpriority="high" />
    <title>ネクマックスの漢字アドベンチャー</title>
  </head>
  <body>
    <div id="root">
      <div id="splash" role="status" aria-label="よみこみ中">
        <img src="%BASE_URL%apple-touch-icon.png" alt="" width="112" height="112" />
        <div class="bar"><i></i></div>
        <p>よみこみ中…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
